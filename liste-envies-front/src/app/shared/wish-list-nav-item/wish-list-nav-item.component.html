<mat-list-item
  class="menu-wishlist"
  [class.active]="active"
  [routerLink]="active ? null : ['/', wishlist.name]"
>
  <img [src]="'/assets/thumb/' + wishlist.picture" class="background-images" />
  <div class="menu-wishlist-content"></div>
  <list-type-icon mat-list-icon [type]="wishlist.type"></list-type-icon>
  <h4 mat-line>{{ wishlist.title }}</h4>
  <p mat-line class="wish-list-item-text layout-row-wrap start-start">
    @for (owner of wishlist.owners; track owner; let last = $last) {
    <app-avatar
      [gravatarId]="owner.email"
      [matTooltip]="owner.name"
      [name]="owner.name"
      [round]="true"
      [src]="owner.photoURL"
      matTooltipPosition="above"
      size="15"
    >
    </app-avatar>
    }
  </p>
  @if (notifsCount$ | async; as notifsCount) {
  <span class="notification-list">
    <mat-icon
      [matBadge]="notifsCount"
      color="accent"
      matBadgeSize="medium"
      matBadgeColor="primary"
      >notifications_active</mat-icon
    ></span
  >
  }
</mat-list-item>
