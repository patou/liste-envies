<div class="page-all">
  <div class="page-background"></div>
  <mat-card appearance="outlined" class="header-page-card">
    <section class="mat-typography">
      <mat-card-header>
        <mat-card-title>
          <h1 class="title-list">
            <mat-icon>history</mat-icon>
            Mes cadeaux reçus
          </h1>
        </mat-card-title>
      </mat-card-header>
    </section>
  </mat-card>
  @if (!(loading$ | async)) {
  <div>
    <app-list-of-wish [list]="listItems" class="col-12"></app-list-of-wish>
  </div>
  } @else {
  <div class="layout-column center-center">
    <mat-spinner></mat-spinner>
  </div>
  }
</div>
