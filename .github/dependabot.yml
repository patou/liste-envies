# develop est la branche par defaut du depot : Dependabot la surveille et y ouvre ses PR.
# On ne met volontairement PAS target-branch : avec target-branch, les options (dont les
# groupes) ne s'appliquent plus aux mises a jour de securite.
version: 2
updates:
  # Front : Angular / yarn (liste-envies-front)
  - package-ecosystem: "npm"
    directory: "/liste-envies-front"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      front:
        applies-to: version-updates
        patterns:
          - "*"
      front-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Back : Maven (liste-envies-war)
  - package-ecosystem: "maven"
    directory: "/liste-envies-war"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      back:
        applies-to: version-updates
        patterns:
          - "*"
      back-security:
        applies-to: security-updates
        patterns:
          - "*"

  # CI : GitHub Actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      ci:
        applies-to: version-updates
        patterns:
          - "*"
      ci-security:
        applies-to: security-updates
        patterns:
          - "*"
