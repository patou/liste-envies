<mat-accordion>
  @for (wishItem of list$ | async; track trackByFn($index, wishItem)) {
  <mat-expansion-panel>
    <mat-expansion-panel-header>
      <mat-panel-title>
        {{ wishItem.label }}
      </mat-panel-title>
      <mat-panel-description>
        {{ wishItem.listTitle }}
      </mat-panel-description>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <app-wish-card [wishItem]="wishItem" [readOnly]="true"></app-wish-card>
    </ng-template>
    <mat-action-row>
      <a mat-button color="primary" [routerLink]="wishItem.listId"
        >Aller à la liste {{ wishItem.listTitle }}</a
      >
    </mat-action-row>
  </mat-expansion-panel>
  }
</mat-accordion>
