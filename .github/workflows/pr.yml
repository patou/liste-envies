name: Add url on PR

on: [pull_request]

jobs:
  commentpr:
    # Dependabot et les forks : jeton en lecture seule et pas d'acces aux secrets, job saute.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ubuntu-latest]
    permissions:
      contents: read
      statuses: read
      checks: read
      pull-requests: write
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: "Wait for status checks"
        id: waitforstatuschecks
        uses: "WyriHaximus/github-action-wait-for-status@v1.8"
        with:
          ignoreActions: commentpr
          checkInterval: 13
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      - uses: rlespinasse/github-slug-action@v2.x
      - uses: mshick/add-pr-comment@v3
        if: steps.waitforstatuschecks.outputs.status == 'success'
        with:
          message: |
            Application deployé sur https://${{ env.GITHUB_HEAD_REF_SLUG }}-dot-test-liste-envies.appspot.com/ (http://${{ env.GITHUB_HEAD_REF_SLUG }}.test-liste-envies.appspot.com/)
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-repeats: false
      - name: Slack notification
        if: env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_AVATAR: repository # Optional. can be (repository, sender, an URL) (defaults to webhook app avatar)
        uses: Ilshidur/action-slack@master
        with:
          args: "Voir l'application deployé sur https://{{ GITHUB_HEAD_REF_SLUG }}-dot-test-liste-envies.appspot.com/"
