<a
  [class.owner]="wishlist.owner"
  [class.active]="active"
  [matTooltip]="
    wishlist.description
      ? (wishlist.description | stripTags | truncate: 200:'...':true)
      : null
  "
  [routerLink]="active ? null : ['/', wishlist.name]"
  matRipple
  class="wish-list-item list-envies-item layout-column space-between-stretch"
  matTooltipPosition="above"
>
  @if (wishlist.picture) {
  <div
    class="backgroundimg"
    [style.backgroundImage]="'url(/assets/thumb/' + wishlist.picture + ')'"
  ></div>
  }
  <div class="wish-list-item-text layout-row space-between-stretch">
    <list-type-icon [type]="wishlist.type"></list-type-icon>
    <h2 class="wish-list-item-heading flex-grow">
      {{ wishlist.title }}
    </h2>
    @if (notifsCount$ | async; as notifsCount) {
    <span class="notification-list">
      <mat-icon
        [matBadge]="notifsCount"
        color="accent"
        matBadgeSize="medium"
        matBadgeColor="primary"
        >notifications_active</mat-icon
      >
    </span>
    }
  </div>

  <div class="wish-list-item-text layout-row-wrap start-start">
    <span>de</span>
    @for (owner of wishlist.owners; track owner; let last = $last) {
    <app-avatar
      [gravatarId]="owner.email"
      [matTooltip]="owner.name"
      [name]="owner.name || owner.email"
      [round]="true"
      [src]="owner.photoURL"
      matTooltipPosition="above"
      size="15"
    >
    </app-avatar>
    <span
      [matTooltip]="owner.email"
      [title]="owner.email"
      class="owners"
      matTooltipPosition="above"
      >{{ owner.name || owner.email }}</span
    >@if (!last) {
    <span>, </span>
    } }
  </div>
</a>
